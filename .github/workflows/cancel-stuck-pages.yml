name: Clear timed-out Pages deployment
on:
  push:
    branches: [repair-stuck-pages-deployment]
permissions:
  pages: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the old Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/c61e80a054ee90ad643f0a0cfa61e8302dd8bf6b/cancel"
